# Demand taxonomy for an AI clip-art product's prompts and pack briefs.
# The first real wordtoken taxonomy — used to answer "are our users
# sellers or educators?" over clip.art's corpus, 2026-08.
#
# Buckets overlap on purpose: "kawaii ghost sticker" is seller AND
# kids-characters, and the overlap is the finding.

name: clipart-demand
version: 1
buckets:
  educational:
    description: Teaching material — worksheets, classroom, homeschool
    patterns:
      - worksheet
      - "\\bschool\\b"
      - alphabet
      - phonics
      - counting
      - classroom
      - teacher
      - homeschool
      - kindergarten
      - preschool
      - flashcard
      - curriculum
      - lesson
      - spelling
      - sight word
      - handwriting
      - tracing
      - "grade \\d"
  seller_commercial:
    description: Asset-for-sale signals — POD, party printables, shops
    patterns:
      - sticker
      - planner
      - invitation
      - wedding
      - baby shower
      - bridal shower
      - gender reveal
      - birthday
      - banner
      - logo
      - t-?shirt
      - mug
      - tumbler
      - svg
      - cricut
      - print on demand
      - etsy
      - sublimation
      - scrapbook
      - junk journal
      - card making
      - bundle
      - seamless
      - price tag
      - packaging
  holiday_seasonal:
