[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "wordtoken"
version = "1.0.0"
description = "Mine what your users actually want from piles of prompts, briefs, and search queries."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Zev Uhuru", email = "zev@esy.com" }]
keywords = [
  "prompts",
  "intent",
  "demand",
  "text-mining",
  "taxonomy",
  "prompt-analysis",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
dependencies = ["pyyaml>=6.0"]

[project.scripts]
wordtoken = "wordtoken.cli:main"

[project.urls]
Homepage = "https://wordtoken.com"
Documentation = "https://github.com/WordToken/wordtoken#readme"
Repository = "https://github.com/WordToken/wordtoken"
Issues = "https://github.com/WordToken/wordtoken/issues"
Changelog = "https://github.com/WordToken/wordtoken/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "mypy>=1.11",
  "ruff>=0.6",
  "types-PyYAML",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wordtoken"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
  "E", "W",  # pycodestyle
  "F",       # pyflakes
  "I",       # isort
  "UP",      # pyupgrade
  "B",       # flake8-bugbear
  "SIM",     # flake8-simplify
  "C4",      # comprehensions
  "RUF",     # ruff-specific
]
ignore = ["E501"] # formatter owns line length

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/wordtoken"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true

[tool.coverage.run]
source = ["wordtoken"]
branch = true

[tool.codespell]
# Fixture corpora are verbatim user-register text; esy is a real domain.
skip = "tests/fixtures/*"
ignore-words-list = "esy"

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
