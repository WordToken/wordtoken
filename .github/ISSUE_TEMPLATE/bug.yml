name: Bug report
description: Something behaves incorrectly
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: wordtoken version
      description: Output of `wordtoken --version`
      placeholder: wordtoken 1.0.0
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: >
        The smallest corpus + taxonomy + command (or code) that shows the
        problem. Scrub anything sensitive first.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
